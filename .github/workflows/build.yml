name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/ShiftDrop/ShiftDrop.csproj
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          "version=$v" >> $env:GITHUB_OUTPUT
          $exists = git tag --list "v$v"
          "tag_exists=$([bool]$exists)".ToLower() >> $env:GITHUB_OUTPUT
          Write-Host "Version $v, tag exists: $([bool]$exists)"

      - name: Publish
        run: dotnet publish src/ShiftDrop/ShiftDrop.csproj -c Release -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath ShiftDrop-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ShiftDrop-win-x64
          path: ShiftDrop-win-x64.zip

      # Новая версия в csproj на main → автоматически релиз vX.Y.Z с архивом
      - name: Release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && steps.ver.outputs.tag_exists == 'false'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: ShiftDrop ${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: ShiftDrop-win-x64.zip
